<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Picker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 520px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            text-align: center;
        }
        h2 {
            font-size: 1.1rem;
            text-align: center;
            margin: 0 0 16px;
            color: #555;
        }
        section {
            margin: 24px 0;
        }
        section.hidden {
            display: none;
        }
        #player-count {
            width: 100px;
            padding: 8px 16px;
            font-size: 1rem;
        }
        #max-time {
            width: 100px;
            padding: 8px 16px;
            font-size: 1rem;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
        }
        .status {
            margin-top: 16px;
            text-align: center;
            font-size: 1.1rem;
            min-height: 1.4em;
        }
        .status.error {
            color: #b00020;
        }
        .status.success {
            color: #1a7f37;
        }
        .quiz-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #e5e5e5;
        }
        .quiz-row label {
            flex: 1;
        }
        .quiz-row input {
            width: 64px;
            padding: 6px;
            font-size: 1rem;
        }
        #quiz-form {
            display: flex;
            flex-direction: column;
        }
        #quiz-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }
        #quiz-actions button[type="button"] {
            background: none;
            border: 1px solid #999;
        }
        ul#matches-list {
            list-style: none;
            padding: 0;
            margin: 16px 0;
        }
        ul#matches-list li {
            padding: 10px 12px;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        ul#matches-list li.top-pick {
            border-color: #1a7f37;
            background: #f1f8f3;
            font-weight: bold;
        }
        #results-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <section id="player-section">
        <form id="player-form">
            <div id="player-count-section">
                <label for="player-count">How many players do you have?</label>
                <input type="number" id="player-count" min="1" step="1" placeholder="e.g. 3" required>
            </div>
            <div id="max-time-section">
                <label for="max-time">What is the maximum time you have?</label>
                <input type="number" id="max-time" min="0" step="10" placeholder="e.g. 60" required>
            </div>
            <div id="submit-button">
                <button type="submit">Submit</button>
            </div>
        </form>
        <div id="player-status" class="status"></div>
    </section>

    <section id="quiz-section" class="hidden">
        <h2 id="quiz-heading"></h2>
        <form id="quiz-form">
            <div id="quiz-questions"></div>
            <div id="quiz-actions">
                <button type="button" id="quiz-back-btn">Back</button>
                <button type="submit">See My Matches</button>
            </div>
        </form>
        <div id="quiz-status" class="status"></div>
    </section>

    <section id="results-section" class="hidden">
        <div id="results-content"></div>
        <div id="results-actions">
            <button type="button" id="start-over-btn">Start Over</button>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
